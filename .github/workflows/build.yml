name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          python3 - <<'PY'
          import zipfile, os
          with zipfile.ZipFile('src.zip') as z:
              for info in z.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.endswith('/'):
                      os.makedirs(name, exist_ok=True)
                      continue
                  d = os.path.dirname(name)
                  if d:
                      os.makedirs(d, exist_ok=True)
                  with z.open(info) as s, open(name, 'wb') as t:
                      t.write(s.read())
          print('extracted')
          PY
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "最新 APK" --notes "自动构建，debug 签名，自用"
